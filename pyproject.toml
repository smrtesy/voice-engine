[tool.poetry]
name = "voice-engine"
version = "0.1.0"
description = "Voice generation engine for smrtVoice app"
authors = ["smrtesy <chanoch@maor.org>"]
readme = "README.md"
packages = [{include = "voice_engine", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"

# HTTP client
httpx = "^0.27.0"
aiohttp = "^3.9.0"

# Job queue
huey = "^2.5.0"
redis = "^5.0.0"

# Audio processing
pydub = "^0.25.1"
soundfile = "^0.12.0"
librosa = "^0.10.0"
numpy = "^1.26.0"
audiotsm = "^0.1.2"  # WSOLA time-stretch for post-production

# Database & Storage
supabase = "^2.4.0"
postgrest = "^0.16.0"

# LLM
# 0.120.0, not the old ^0.20.0: the preprocessor now sends its system prefix as a
# cache_control block with a 1h TTL. `cache_control` on a text block did not exist
# in the SDK until ~0.34 and the `ttl` field arrived later still, and 0.20.x typed
# `system` as a bare str — so on the old pin the cached call would neither
# type-check nor cache. The call surface we use (AsyncAnthropic, messages.create
# with model/max_tokens/temperature/system/messages, response.content[0].text) is
# unchanged across the jump, and 0.120.0 resolves cleanly next to supabase 2.x.
anthropic = "^0.120.0"

# Google APIs
google-api-python-client = "^2.120.0"
google-auth = "^2.28.0"
google-auth-oauthlib = "^1.2.0"

# Document parsing
python-docx = "^1.1.0"

# Utilities
structlog = "^24.1.0"
tenacity = "^8.2.0"
python-multipart = "^0.0.9"
cryptography = "^42.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.2.0"
ruff = "^0.3.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4"]
# UP042 wants StrEnum instead of (str, Enum). The (str, Enum) pattern is
# intentional here (its `str()` repr differs from StrEnum, and code/pydantic
# depend on the current behavior), so we keep it and silence the stylistic hint.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates are long natural-language strings; line length is not useful.
"src/voice_engine/preprocessor/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
